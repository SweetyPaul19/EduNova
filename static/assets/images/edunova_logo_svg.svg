<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="100%" height="100%">
  <defs>
    <style>
      .brand-color { fill: #00bcd4; stroke: #00bcd4; }
      .brand-fill { fill: #00bcd4; }
      .text-style {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 72px;
        fill: #00bcd4;
      }
    </style>
  </defs>

  <!-- Book Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Book Body/Cover with Rounded Corners -->
    <rect x="20" y="20" width="80" height="100" rx="16" ry="16" class="brand-fill" />
    
    <!-- Spine Definition (Left Curve Detail) -->
    <path d="M 20,36 C 20,24 28,20 36,20 L 36,120 C 28,120 20,112 20,100 Z" fill="#00acc1" />

    <!-- Text Lines inside Book -->
    <line x1="45" y1="48" x2="82" y2="48" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="45" y1="62" x2="82" y2="62" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

    <!-- Pages/Bottom Shelf Cutout -->
    <rect x="34" y="90" x2="88" width="54" height="12" rx="4" ry="4" fill="#ffffff" />
  </g>

  <!-- Logo Text: EduNova -->
  <text x="135" y="98" class="text-style">EduNova</text>
</svg>
